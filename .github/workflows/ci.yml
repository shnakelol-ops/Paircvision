# PáircVision Guardian V1 — CI baseline (engineering infrastructure only).
#
# Runs the existing test suite, the production build (same command as
# vercel.json) and a TypeScript known-errors check on every pull request to
# main and every push to main. It changes nothing: read-only token, no
# secrets, no deployments, no merges.
#
# TypeScript: `tsc -b` reports pre-existing errors on main (53 at 85c10d0).
# They are listed one by one in .github/typescript-baseline.txt and are NOT
# fixed here. The TypeScript check fails on any new error, on a fixed error
# still listed in the baseline, on baseline growth, or if tsc cannot run.
# Passing it does NOT mean the code type-checks cleanly.
#
# Third-party actions are pinned to full commit SHAs (tag in the comment).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # npm ci deletes the tracked (Windows) node_modules before installing.
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Same command as vercel.json "buildCommand".
      - run: node node_modules/vite/bin/vite.js build

  typecheck:
    name: TypeScript (known-errors baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: on a PR the merge commit's first parent is the base,
          # so the baseline file can be compared with the base branch's copy.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Self-test the baseline checker
        run: node --test .github/scripts/ts-baseline.test.mjs
      - name: Base branch copy of the baseline (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e HEAD^1:.github/typescript-baseline.txt 2>/dev/null; then
            git show HEAD^1:.github/typescript-baseline.txt > "$RUNNER_TEMP/base-baseline.txt"
          else
            echo "::notice::Base branch has no TypeScript baseline yet; growth check skipped."
          fi
      - name: Compare tsc -b with the known-errors baseline
        run: node .github/scripts/ts-baseline.mjs check --base-baseline "$RUNNER_TEMP/base-baseline.txt" --summary "$GITHUB_STEP_SUMMARY"
