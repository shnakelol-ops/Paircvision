# PáircVision Guardian V1 — CI baseline (engineering infrastructure only).
#
# Runs the existing test suite, the production build (same command as
# vercel.json) and a TypeScript known-errors check on every pull request to
# main and every push to main. It changes nothing: read-only token, no
# secrets, no deployments, no merges.
#
# TypeScript: `tsc -b` reports pre-existing errors on main (53 at 85c10d0).
# They are listed one by one in .github/typescript-baseline.txt and are NOT
# fixed here. The TypeScript check fails on any new error, on a fixed error
# still listed in the baseline, on baseline growth, or if tsc cannot run.
# Passing it does NOT mean the code type-checks cleanly.
#
# Unit tests also run the test-integrity guard (.github/scripts/test-guard.mjs):
# every baselined test must run and pass, nothing may be skipped, and protected
# Event Stats expectation files may not change without a reviewed baseline update.
#
# "Event Stats laboratory (engine)" runs the independent laboratory in lab/event-stats:
# reference independence and byte-for-byte reproducibility, lab type checks, and the
# comparison of the production statistics engine with independently calculated ledgers
# for synthetic matches A, B, C and D. No retries, no repairs. Developer-side only — nothing
# under lab/ is built into, or served by, the app.
#
# Third-party actions are pinned to full commit SHAs (tag in the comment).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull requests: a newer push cancels the older run. Pushes to main and manual runs each get their
  # own group, so no run on main is ever cancelled or replaced (a shared group keeps only one pending
  # run and cancels older pending ones).
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: on a PR the merge commit's first parent is the base, so the
          # test-integrity baselines can be compared with the base branch's copies.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # npm ci deletes the tracked (Windows) node_modules before installing.
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest-report.json"
      - name: Self-test the test-integrity guard
        if: always()
        run: node --test .github/scripts/test-guard.test.mjs
      - name: Base branch copies of the test baselines (pull requests only)
        if: always() && github.event_name == 'pull_request'
        run: |
          for f in test-baseline.txt protected-expectations.txt; do
            if git cat-file -e "HEAD^1:.github/$f" 2>/dev/null; then
              git show "HEAD^1:.github/$f" > "$RUNNER_TEMP/base-$f"
            else
              echo "::notice::Base branch has no .github/$f yet; review comparison skipped."
            fi
          done
      # Runs even if the test step failed, so a crashed or partial run is still judged.
      - name: Test-integrity guard
        if: always()
        run: >-
          node .github/scripts/test-guard.mjs check
          --report "$RUNNER_TEMP/vitest-report.json"
          --base-baseline "$RUNNER_TEMP/base-test-baseline.txt"
          --base-manifest "$RUNNER_TEMP/base-protected-expectations.txt"
          --summary "$GITHUB_STEP_SUMMARY"

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Same command as vercel.json "buildCommand".
      - run: node node_modules/vite/bin/vite.js build

  typecheck:
    name: TypeScript (known-errors baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: on a PR the merge commit's first parent is the base,
          # so the baseline file can be compared with the base branch's copy.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Self-test the baseline checker
        run: node --test .github/scripts/ts-baseline.test.mjs
      - name: Base branch copy of the baseline (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e HEAD^1:.github/typescript-baseline.txt 2>/dev/null; then
            git show HEAD^1:.github/typescript-baseline.txt > "$RUNNER_TEMP/base-baseline.txt"
          else
            echo "::notice::Base branch has no TypeScript baseline yet; growth check skipped."
          fi
      - name: Compare tsc -b with the known-errors baseline
        run: node .github/scripts/ts-baseline.mjs check --base-baseline "$RUNNER_TEMP/base-baseline.txt" --summary "$GITHUB_STEP_SUMMARY"

  lab:
    name: Event Stats laboratory (engine)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Each step runs even if an earlier one failed, so one run reports everything; the
      # job fails if any step fails.
      - name: Reference independence and reproducibility
        if: ${{ !cancelled() }}
        run: node lab/event-stats/tools/reproduce.mjs
      - name: Laboratory TypeScript
        if: ${{ !cancelled() }}
        run: node lab/event-stats/tools/check-lab-types.mjs
      - name: Engine vs independent ledgers (matches A, B, C, D)
        if: ${{ !cancelled() }}
        run: npx vitest run --config lab/event-stats/engine/vitest.lab.config.ts --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/lab-vitest.json"
      - name: Verify the laboratory ran completely
        if: ${{ !cancelled() }}
        run: >-
          node lab/event-stats/tools/verify-lab-run.mjs
          --vitest-report "$RUNNER_TEMP/lab-vitest.json"
          --engine-report lab/event-stats/out/engine-report.json
          --summary "$GITHUB_STEP_SUMMARY"
